spring:
  application:
    name: buildshield-iam-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:iam_db}
    username: ${DB_USER:iam_service}
    password: ${DB_PASSWORD:iam_service}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
      data-source-properties:
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:2000}"
        connectTimeout: 5
        socketTimeout: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000

server:
  # Detrás del gateway: Swagger "Try it out" usa el host del gateway (X-Forwarded-*).
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /api/v1/api-docs

buildshield:
  security:
    # Emisor de los tokens: lo validan todos los servicios y el gateway.
    issuer: buildshield-iam
    jwt-public-key: ${BUILDSHIELD_JWT_PUBLIC_KEY}
    jwt-private-key: ${BUILDSHIELD_JWT_PRIVATE_KEY}
    public-endpoints:
      - POST /api/v1/auth/sign-up
      - POST /api/v1/auth/sign-in
      - POST /api/v1/auth/refresh
      - POST /api/v1/auth/password-reset
      - POST /api/v1/auth/password-reset/confirm
  # iam no tiene escrituras sensibles a reintentos desde el celular: sin tabla idempotency_keys.
  idempotency:
    enabled: false
  messaging:
    topic: buildshield.iam
  iam:
    # Duración de la sesión renovable y del enlace de recuperación de contraseña.
    refresh-token-ttl: P7D
    password-reset-ttl: PT30M
    password-reset-url: ${BUILDSHIELD_PASSWORD_RESET_URL:http://localhost:4200/restablecer-contrasena}
